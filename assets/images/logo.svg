<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <linearGradient id="redGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dc2626"/>
      <stop offset="100%" style="stop-color:#ef4444"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="500" height="500" fill="transparent"/>
  
  <!-- Main circle background -->
  <circle cx="250" cy="220" r="180" fill="#0f172a" filter="url(#shadow)"/>
  <circle cx="250" cy="220" r="170" fill="#1a1a2e" stroke="url(#blueGradient)" stroke-width="6"/>
  
  <!-- Gear/Cog outer -->
  <g transform="translate(250, 220)">
    <g fill="url(#blueGradient)">
      <rect x="-12" y="-155" width="24" height="35" rx="4"/>
      <rect x="-12" y="120" width="24" height="35" rx="4"/>
      <rect x="-155" y="-12" width="35" height="24" rx="4"/>
      <rect x="120" y="-12" width="35" height="24" rx="4"/>
      <rect x="80" y="-120" width="24" height="35" rx="4" transform="rotate(45 92 -102)"/>
      <rect x="-104" y="85" width="24" height="35" rx="4" transform="rotate(45 -92 102)"/>
      <rect x="-104" y="-120" width="24" height="35" rx="4" transform="rotate(-45 -92 -102)"/>
      <rect x="80" y="85" width="24" height="35" rx="4" transform="rotate(-45 92 102)"/>
    </g>
    <circle cx="0" cy="0" r="110" fill="none" stroke="url(#blueGradient)" stroke-width="16"/>
    <circle cx="0" cy="0" r="90" fill="#1a1a2e"/>
  </g>
  
  <!-- Wrench Icon -->
  <g transform="translate(250, 220)">
    <!-- Wrench body -->
    <rect x="-8" y="-50" width="16" height="100" rx="4" fill="#e5e7eb"/>
    <rect x="-5" y="-45" width="10" height="90" rx="3" fill="#9ca3af"/>
    
    <!-- Top wrench head -->
    <path d="M-25,-50 C-25,-70 -15,-75 0,-75 C15,-75 25,-70 25,-50 L15,-50 C15,-60 8,-65 0,-65 C-8,-65 -15,-60 -15,-50 Z" 
          fill="url(#redGradient)"/>
    
    <!-- Bottom wrench head -->
    <path d="M-25,50 C-25,70 -15,75 0,75 C15,75 25,70 25,50 L15,50 C15,60 8,65 0,65 C-8,65 -15,60 -15,50 Z" 
          fill="url(#redGradient)"/>
  </g>
  
  <!-- Car silhouette below wrench -->
  <g transform="translate(250, 260)">
    <path d="M-40,15 L-35,0 L-15,-12 L15,-12 L35,0 L40,15 L40,22 L-40,22 Z" 
          fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
    <path d="M-12,-10 L-28,2 L-28,10 L-12,10 Z" fill="#3b82f6" opacity="0.5"/>
    <path d="M-8,-10 L12,-10 L22,2 L22,10 L-8,10 Z" fill="#3b82f6" opacity="0.5"/>
    <circle cx="-22" cy="22" r="10" fill="#1f2937" stroke="#374151" stroke-width="2"/>
    <circle cx="-22" cy="22" r="4" fill="#6b7280"/>
    <circle cx="22" cy="22" r="10" fill="#1f2937" stroke="#374151" stroke-width="2"/>
    <circle cx="22" cy="22" r="4" fill="#6b7280"/>
  </g>
  
  <!-- Text: AUTO -->
  <text x="250" y="420" 
        font-family="Arial, sans-serif" 
        font-size="52" 
        font-weight="bold" 
        fill="#ffffff" 
        text-anchor="middle"
        letter-spacing="6">AUTO</text>
  
  <!-- Text: REPAIR HUB -->
  <text x="250" y="465" 
        font-family="Arial, sans-serif" 
        font-size="32" 
        font-weight="bold" 
        fill="url(#redGradient)" 
        text-anchor="middle"
        letter-spacing="3">REPAIR HUB</text>
  
  <!-- Underline accent -->
  <line x1="120" y1="480" x2="200" y2="480" stroke="url(#blueGradient)" stroke-width="4" stroke-linecap="round"/>
  <circle cx="250" cy="480" r="6" fill="url(#redGradient)"/>
  <line x1="300" y1="480" x2="380" y2="480" stroke="url(#blueGradient)" stroke-width="4" stroke-linecap="round"/>
</svg>
