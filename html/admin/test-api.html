<!DOCTYPE html>
<html>
<head>
    <title>Test Admin API</title>
</head>
<body>
    <h1>Testing adminGetShops.php</h1>
    <button onclick="testAPI()">Test API</button>
    <pre id="result"></pre>

    <script>
        async function testAPI() {
            try {
                const response = await fetch('../../helper/adminGetShops.php');
                const text = await response.text();
                
                document.getElementById('result').textContent = 'Raw Response:\n' + text;
                
                try {
                    const data = JSON.parse(text);
                    document.getElementById('result').textContent = 'Parsed JSON:\n' + JSON.stringify(data, null, 2);
                } catch (e) {
                    document.getElementById('result').textContent = 'JSON Parse Error:\n' + e.message + '\n\nRaw Response:\n' + text;
                }
            } catch (error) {
                document.getElementById('result').textContent = 'Fetch Error:\n' + error.message;
            }
        }
    </script>
</body>
</html>
