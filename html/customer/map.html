<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auto Repair Hub - Find Nearby Shops</title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css"
    />

    <link rel="stylesheet" href="../../assets/styles/navbar.css">
    <link rel="stylesheet" href="../../assets/styles/map.css">
  </head>
  <body>
    <header
    >
      <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
        <div class="container">
          <a class="navbar-brand" href="homepage.html">
            <i class="fa-solid fa-motorcycle"></i
            ><span style="color: var(--primary-red)"> Moto</span>Care
          </a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
              <li class="nav-item">
                <a class="nav-link" href="#home">Home</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#partnership">Partnership</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#aboutus">About Us</a>
              </li>
              <li class="nav-item ">
                <a class="nav-link " href="../../signin.html">Sign In</a>
              </li>
              <!-- <li class="nav-item ">
                <a class="nav-link logged-out" href="./signin.html">Sign In</a>
              </li> -->
              <li class="nav-item ">
                <a class="nav-link signup" href="../../signup.html">Sign Up</a>
              </li>
              <!-- <li class="nav-item ">
                <a class="nav-link signup logged-out" href="./signup.html">Sign Up</a>
              </li> -->
            </ul>
            <div class="profile-dropdown">
              <button class="btn-user" id="profileBtn">
                <div class="d-flex flex-column gap-0">
                  <p class="user-name mb-0 fw-bold">Juan Dela Cruz</p>
                  <p class="mb-0 text-muted">Customer</p>
                </div>
                <i
                  class="fa-solid fa-angle-down"
                  style="font-size: 0.8rem; color: var(--text-gray)"
                ></i>
              </button>
              <div class="dropdown-menu-custom" id="profileDropdown">
                <a href="./account.html" class="dropdown-item-custom">
                  <i class="fas fa-user-circle me-2"></i>Account
                </a>
                <a href="./booking-status.html" class="dropdown-item-custom">
                  <i class="fa-solid fa-calendar-check me-2"></i>Booking
                </a>
                <a href="./index.html" class="dropdown-item-custom">
                  <i class="fas fa-sign-out-alt me-2"></i>Sign Out
                </a>
              </div>
            </div>
          </div>
        </div>
      </nav>
    </header>
    <div class="container-fluid">
      <!-- Navigation -->
    

      <!-- Map Section -->
      <div class="row">
        <div class="col-12 p-0">
          <div class="map-container">
            <div id="map"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap Modal for Booking -->
    <div class="modal fade" id="bookingModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div
          class="modal-content"
          style="
            background: var(--dark-secondary);
            border: 1px solid var(--dark-tertiary);
          "
        >
          <div
            class="modal-header text-white"
            style="
              background: var(--dark-secondary);
              border-bottom: 1px solid var(--dark-tertiary);
            "
          >
            <h5 class="modal-title" style="color: var(--text-light)">
              <i
                class="fas fa-calendar-check me-2"
                style="color: var(--red-primary)"
              ></i>
              Book Your Service
            </h5>
            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div
            class="modal-body"
            style="background: var(--dark-secondary); color: var(--text-light)"
          >
            <form id="bookingForm">
              <div class="mb-3">
                <label class="form-label"
                  ><strong>Selected Shop:</strong></label
                >
                <p
                  id="selectedShop"
                  class="fw-bold"
                  style="color: var(--red-primary)"
                ></p>
              </div>
              <div class="row">
                <div class="col-md-6 mb-3">
                  <label class="form-label" style="color: var(--text-light)"
                    >Your Name</label
                  >
                  <input
                    type="text"
                    class="form-control"
                    required
                  />
                </div>
                <div class="col-md-6 mb-3">
                  <label class="form-label" style="color: var(--text-light)"
                    >Phone Number</label
                  >
                  <input
                    type="tel"
                    class="form-control"
                    required
                  />
                </div>
              </div>
              <div class="mb-3">
                <label class="form-label" style="color: var(--text-light)"
                  >Email Address</label
                >
                <input
                  type="email"
                  class="form-control"
                  required
                />
              </div>
              <div class="row">
                <div class="col-md-6 mb-3">
                  <label class="form-label" style="color: var(--text-light)"
                    >Preferred Date</label
                  >
                  <input
                    type="date"
                    class="form-control"
                    required
                  />
                </div>
                <div class="col-md-6 mb-3">
                  <label class="form-label" style="color: var(--text-light)"
                    >Preferred Time</label
                  >
                  <select
                    class="form-control"
                    required
                  >
                    <option value="" disabled selected>Select Time</option>
                    <option value="09:00">9:00 AM</option>
                    <option value="10:00">10:00 AM</option>
                    <option value="11:00">11:00 AM</option>
                    <option value="14:00">2:00 PM</option>
                    <option value="15:00">3:00 PM</option>
                    <option value="16:00">4:00 PM</option>
                  </select>
                </div>
              </div>
              <div class="mb-3">
                <label class="form-label" style="color: var(--text-light)"
                  >Service Needed</label
                >
                <textarea
                  class="form-control"
                  rows="3"
                  placeholder="Describe the service you need..."
                ></textarea>
              </div>
            </form>
          </div>
          <div
            class="modal-footer"
            style="
              background: var(--dark-secondary);
              border-top: 1px solid var(--dark-tertiary);
            "
          >
            <button
              type="button"
              class="btn"
              style="
                background: var(--gray-card);
                color: var(--text-light);
                border: 1px solid var(--dark-tertiary);
              "
              data-bs-dismiss="modal"
            >
              Cancel
            </button>
            <button
              type="button"
              class="btn btn-book"
              onclick="submitBooking()"
            >
              <i class="fas fa-check me-2"></i>Confirm Booking
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>

    <script src="../../assets/scripts/navbar.js"></script>
    <script src="../../assets/scripts/map.js"></script>
  </body>
</html>
