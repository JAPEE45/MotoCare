<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Services - MotoCare</title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../../assets/styles/owner-services.css" />
    <link rel="stylesheet" href="../../assets/styles/navbar.css" />
  </head>
  <body>
    <header>
      <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
        <div class="container">
          <a class="navbar-brand" href="booking-service.html">
            <i class="fa-solid fa-motorcycle"></i
            ><span style="color: var(--primary-red)"> Moto</span>Care
          </a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
              <li class="nav-item">
                <a class="nav-link" href="#">Dashboard</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="./user-management.html"
                  >User Management</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#"
                  >Services</a
                >
              </li>
            </ul>
            <div class="profile-dropdown">
              <button class="btn-user" id="profileBtn">
                <div class="d-flex flex-column gap-0">
                  <p class="user-name mb-0 fw-bold">Juan Dela Cruz</p>
                  <p class="mb-0 text-muted">Shop Owner</p>
                </div>
                <i
                  class="fa-solid fa-angle-down"
                  style="font-size: 0.8rem; color: var(--text-gray)"
                ></i>
              </button>
              <div class="dropdown-menu-custom" id="profileDropdown">
                <a href="../account.html" class="dropdown-item-custom">
                  <i class="fas fa-user-circle me-2"></i>Account
                </a>
                <a href="../index.html" class="dropdown-item-custom">
                  <i class="fas fa-sign-out-alt me-2"></i>Sign Out
                </a>
              </div>
            </div>
          </div>
        </div>
      </nav>
    </header>

    <!-- Main Content -->
    <div class="container" style="margin-top: 100px">
      <!-- Page Header -->
      <div class="page-header">
        <div class="row align-items-center">
          <div class="col-md-6">
            <h1 class="page-title">Services</h1>
            <p class="mb-0" style="var:(--text-gray);">Manage your auto repair services</p>
          </div>
          <div class="col-md-6 text-md-end">
            <button
              class="btn btn-primary"
              data-bs-toggle="modal"
              data-bs-target="#serviceModal"
            >
              <i class="fas fa-plus me-2"></i>Add Service
            </button>
          </div>
        </div>
      </div>

      <!-- Services Grid -->
      <div id="servicesContainer" class="row">
        <!-- Services will be dynamically loaded here -->
      </div>

      <!-- Empty State (shown when no services) -->
      <div id="emptyState" class="empty-state" style="display: none">
        <i class="fas fa-tools"></i>
        <h3>No Services Yet</h3>
        <p>
          Start by adding your first auto repair service to help customers know
          what you offer.
        </p>
        <button
          class="btn btn-primary btn-lg"
          data-bs-toggle="modal"
          data-bs-target="#serviceModal"
        >
          <i class="fas fa-plus me-2"></i>Add Your First Service
        </button>
      </div>
    </div>

    <!-- Service Modal -->
    <div class="modal fade" id="serviceModal" tabindex="-1">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="modalTitle">Add New Service</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <form id="serviceForm">
              <input type="hidden" id="serviceId" value="" />
              <div class="row">
                <div class="col-md-6">
                  <div class="mb-3">
                    <label for="serviceName" class="form-label"
                      >Service Name *</label
                    >
                    <input
                      type="text"
                      class="form-control"
                      id="serviceName"
                      required
                    />
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="mb-3">
                    <label for="serviceIcon" class="form-label">Icon</label>
                    <select class="form-control" id="serviceIcon">
                      <option value="fas fa-wrench">Wrench</option>
                      <option value="fas fa-oil-can">Oil Can</option>
                      <option value="fas fa-car">Car</option>
                      <option value="fas fa-cogs">Gears</option>
                      <option value="fas fa-tools">Tools</option>
                      <option value="fas fa-tire">Tire</option>
                      <option value="fas fa-battery-full">Battery</option>
                      <option value="fas fa-spray-can">Paint</option>
                    </select>
                  </div>
                </div>
              </div>
              <div class="mb-3">
                <label for="serviceDescription" class="form-label"
                  >Description</label
                >
                <textarea
                  class="form-control"
                  id="serviceDescription"
                  rows="3"
                ></textarea>
              </div>
              <div class="row">
                <div class="col-md-6">
                  <div class="mb-3">
                    <label for="servicePrice" class="form-label"
                      >Price (₱) *</label
                    >
                    <input
                      type="number"
                      class="form-control"
                      id="servicePrice"
                      step="0.01"
                      min="0"
                      required
                    />
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="mb-3">
                    <label for="serviceDuration" class="form-label"
                      >Duration (hours)</label
                    >
                    <input
                      type="number"
                      class="form-control"
                      id="serviceDuration"
                      step="0.5"
                      min="0"
                    />
                  </div>
                </div>
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-outline-light"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>
            <button type="button" class="btn btn-primary" id="saveService">
              Save Service
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container position-fixed top-0 end-0 p-3">
      <div id="notificationToast" class="toast" role="alert">
        <div class="toast-header">
          <i id="toastIcon" class="fas fa-info-circle text-primary" style="margin-right: 100px"></i>
          <strong class="me-auto" id="toastTitle" style="color: var(--text-gray);">Notification</strong>
          <small id="toastTime">Just now</small>
          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="toast"
          ></button>
        </div>
        <div class="toast-body" id="toastBody">
          Service updated successfully!
        </div>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    
    <script src="../../assets/scripts/owner-services.js"></script>
    <script src="../../assets/scripts/navbar.js"></script>
  </body>
</html>
